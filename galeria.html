<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<title>Galeria — Desenhos para Colorir</title>
<link rel="icon" type="image/png" href="logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f0ff;
    --bg-alt:#ede6ff;
    --bg-alt2:#e8ddff;
    --parchment:#fcfaff;
    --parchment-dim:#f5edff;
    --ink:#2d1b4e;
    --ink-soft:#4a2d7a;
    --ink-light:#1f0f3a;
    --ink-mute:#6b4f9a;
    --amethyst:#7c3aed;
    --amethyst-deep:#5b21b6;
    --amethyst-light:#a78bfa;
    --citrino:#fbbf24;
    --quartzo:#60a5fa;
    --turmalina:#34d399;
    --topazio:#fb923c;
    --line:rgba(124,58,237,0.14);
    --line-strong:rgba(124,58,237,0.24);
    --shadow:0 20px 50px rgba(45,27,78,0.16);
    --gold:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink-light);font-family:'Inter',sans-serif;line-height:1.6;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 28px;}

  header{padding:18px 0;border-bottom:1px solid var(--line);background:rgba(245,240,255,0.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;}
  .logo{font-family:'Fraunces',serif;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--ink);}
  .logo img{height:28px;width:auto;}

  .page-header{text-align:center;padding:40px 0 24px;}
  .page-header h1{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,38px);color:var(--ink-light);}
  .page-header h1 em{font-style:italic;background:linear-gradient(100deg,var(--amethyst),var(--amethyst-deep) 60%,var(--citrino));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .page-header p{color:var(--ink-mute);font-size:15px;margin-top:6px;}
  .page-header .voltar{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-family:'Space Mono',monospace;font-size:12px;color:var(--amethyst);border:1px solid var(--line);padding:6px 16px;border-radius:20px;transition:background .15s ease;text-decoration:none;}
  .page-header .voltar:hover{background:var(--bg-alt);}

  .galeria-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:16px;padding:10px 0 40px;}
  .desenho-card{background:var(--parchment);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .2s ease, box-shadow .2s ease;}
  .desenho-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(45,27,78,0.12);}
  .desenho-card .preview{width:100%;aspect-ratio:1/1;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .desenho-card .preview img{width:100%;height:100%;object-fit:cover;}
  .desenho-card .preview .placeholder{color:var(--ink-mute);font-size:11px;text-align:center;padding:12px;}
  .desenho-card .info{padding:10px 12px 12px;}
  .desenho-card .info .nome{font-size:11px;font-weight:500;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px;line-height:1.3;}
  .desenho-card .info .baixar{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:7px 12px;background:var(--amethyst);color:#fff;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:11px;border:none;cursor:pointer;transition:background .15s ease, transform .15s ease;text-decoration:none;}
  .desenho-card .info .baixar:hover{background:var(--amethyst-deep);transform:translateY(-1px);}
  .desenho-card .info .baixar svg{width:14px;height:14px;stroke:#fff;stroke-width:2.4;fill:none;flex-shrink:0;}
  .desenho-card .info .visualizar{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:4px;padding:5px 12px;background:var(--bg-alt);color:var(--ink-mute);border-radius:8px;font-family:'Inter',sans-serif;font-weight:500;font-size:10px;border:1px solid var(--line);cursor:pointer;transition:background .15s ease;text-decoration:none;}
  .desenho-card .info .visualizar:hover{background:var(--bg-alt2);}

  .contador{text-align:center;font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-mute);padding:10px 0 20px;border-top:1px solid var(--line);}

  .loading{text-align:center;padding:60px 0;color:var(--ink-mute);font-size:14px;}
  .loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--amethyst);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:600px){
    .galeria-grid{grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:12px;}
    .desenho-card .info .nome{font-size:10px;}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><img src="logo.png?v=2" alt="Mundo Colorido">Mundo Colorido</div>
</header>

<section class="wrap">
  <div class="page-header">
    <h1>🎨 Desenhos para <em>Colorir</em></h1>
    <p>Escolha um desenho e clique em "Baixar" para salvar no seu dispositivo.</p>
    <a href="obrigado.html" class="voltar">← Voltar para o kit</a>
  </div>

  <div class="galeria-grid" id="galeria">
    <div class="loading">
      <div class="spinner"></div>
      <p>Carregando desenhos...</p>
    </div>
  </div>

  <div class="contador" id="contador"></div>
</section>

<script>
  (function() {
    // ============================================================
    // CONFIGURAÇÕES
    // ============================================================
    var commit = "7f99554f5c32e5a133aac8e4768ea49b0e8eada2";
    var rawBaseUrl = "https://raw.githubusercontent.com/DescobertaLTDA/mundocolorido/" + commit + "/desenhos/desenhos_para_colorir/";
    
    // Usa um proxy para evitar o bloqueio CORS
    var proxyUrl = "https://corsproxy.io/?";
    var rawComProxy = proxyUrl + encodeURIComponent(rawBaseUrl);

    // ============================================================
    // LISTA COMPLETA DOS DESENHOS (COM ESPAÇOS, IGUAL AO GITHUB)
    // ============================================================
    var desenhos = [
      // GÊNESIS — CRIAÇÃO
      "01 Adam_and_Eve_in_Eden",
      "02 God_creating_sky_and_stars",
      "03 God_creating_ocean_and_fish",
      "04 Animals_walking_into_Noahs_Ark",
      "05 Noah_building_wooden_ark",
      "06 Rainbow_over_ark_with_animals",
      
      // GÊNESIS — MOISÉS
      "07 Baby_Moses_floating_in_basket",
      "08 Moses_as_shepherd_boy_guarding",
      "09 Moses_kneeling_before_burning_bush",
      "10 Moses_parting_Red_Sea",
      "11 Moses_holding_Ten_Commandments_t",
      
      // 1 SAMUEL — DAVI
      "12 Shepherd_boy_playing_harp",
      "13 Chibi_David_facing_Goliath",
      
      // DANIEL
      "14 Daniel_sitting_with_lions",
      
      // JONAS
      "15 Jonah_swallowed_by_cute_whale",
      "16 Jonah_praying_inside_whale",
      "17 Jonah_preaching_to_Nineveh",
      
      // GÊNESIS — JOSÉ
      "18 Joseph_standing_with_brothers",
      "19 Joseph_dreaming_with_wheat_sheaves",
      
      // RUTE
      "20 Ruth_walking_through_wheat_field",
      
      // EVANGELHOS — NATAL
      "21 Angel_Gabriel_appearing_to_Mary",
      "22 Mary_and_Joseph_traveling_to",
      "23 Baby_Jesus_in_manger",
      "24 Shepherds_looking_at_bright_star",
      "25 Angels_singing_above_shepherds",
      "26 Three_Wise_Men_riding_camels",
      "27 Wise_men_presenting_gifts",
      "28 Young_Jesus_talking_with_elders",
      
      // EVANGELHOS — MINISTÉRIO
      "30 Jesus_baptized_by_John",
      "31 Jesus_choosing_twelve_disciples",
      "32 Jesus_calming_storm_on_boat",
      "33 Jesus_walking_on_water",
      "34 Jesus_feeding_crowd_with_fish",
      "35 Jesus_healing_blind_man",
      "36 Jesus_healing_sick_girl",
      "37 Jesus_welcoming_smiling_children",
      "38 Shepherd_carrying_lost_lamb",
      "39 Jesus_telling_Good_Samaritan_story",
      "40 Father_welcoming_prodigal_son_home",
      "41 Jesus_turning_water_into_wine",
      "42 Zacchaeus_climbing_tree_for_Jesus",
      "43 Jesus_raising_Lazarus_family_reu",
      
      // EVANGELHOS — PAIXÃO E RESSURREIÇÃO
      "44 Jesus_riding_donkey_into_Jerusalem",
      "45 Jesus_and_disciples_at_table",
      "46 Jesus_praying_in_garden",
      "47 Jesus_carrying_cross_line_art",
      "48 Empty_tomb_with_rolled_stone",
      "49 Angel_sitting_by_empty_tomb",
      "50 Jesus_appearing_to_Mary_Magdalene",
      "51 Jesus_appearing_to_disciples",
      "52 Jesus_ascending_to_heaven",
      
      // ATOS DOS APÓSTOLOS
      "53 Disciples_receiving_Holy_Spirit",
      "54 Peter_and_John_healing_man",
      "55 Traveler_on_boat_spreading_gospel",
      "56 Early_Christians_praying_and_sha",
      
      // VIDA CRISTÃ — ATUALIDADE
      "57 Family_praying_together_at_dinner",
      "58 Children_praying_in_bedroom",
      "59 Noah_s_ark_rainbow_scene_illustr",
      "60 Jesus_surrounded_by_children"
    ];

    var galeria = document.getElementById('galeria');
    var contador = document.getElementById('contador');

    if (!galeria) return;

    // Remove o loading
    galeria.innerHTML = '';

    function nomeAmigavel(nome) {
      return nome
        .replace(/\d+ /g, '')
        .replace(/_/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    var total = desenhos.length;
    var carregados = 0;

    desenhos.forEach(function(nome) {
      var card = document.createElement('div');
      card.className = 'desenho-card';

      var nomeCodificado = encodeURIComponent(nome);
      var nomeArquivo = nome + '.jpeg';
      var nomeArquivoCodificado = nomeCodificado + '.jpeg';
      
      // URL com proxy para exibir a imagem
      var urlImagemComProxy = rawComProxy + nomeArquivoCodificado;
      
      // URL direta para download (sem proxy, pois o download não é bloqueado)
      var urlDownload = rawBaseUrl + nomeArquivoCodificado;
      
      var nomeExibicao = nomeAmigavel(nome);

      card.innerHTML = `
        <div class="preview">
          <img src="${urlImagemComProxy}" alt="${nomeExibicao}" loading="lazy" 
               onerror="this.style.display='none';this.parentElement.innerHTML='<div class=placeholder>🖼️<br>${nomeExibicao}</div>'">
        </div>
        <div class="info">
          <div class="nome">${nomeExibicao}</div>
          <a href="${urlDownload}" download="${nomeArquivo}" class="baixar">
            <svg viewBox="0 0 24 24"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
            Baixar
          </a>
          <a href="${urlImagemComProxy}" target="_blank" rel="noopener" class="visualizar">
            👁️ Ver imagem
          </a>
        </div>
      `;

      galeria.appendChild(card);

      var img = card.querySelector('img');
      if (img) {
        img.addEventListener('load', function() {
          carregados++;
          if (contador) {
            contador.textContent = '📚 ' + carregados + ' de ' + total + ' desenhos carregados';
          }
        });
        img.addEventListener('error', function() {
          carregados++;
          if (contador) {
            contador.textContent = '📚 ' + carregados + ' de ' + total + ' desenhos carregados';
          }
        });
      }
    });

    if (contador) {
      contador.textContent = '📚 0 de ' + total + ' desenhos carregados';
    }
  })();
</script>

</body>
</html>
